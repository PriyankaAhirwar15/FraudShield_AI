version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: fraudshield-backend
    ports:
      - "8000:8000"
    volumes:
      - ./fraudshield.db:/app/fraudshield.db
      - ./ml/saved_models:/app/ml/saved_models
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/fraudshield.db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: fraudshield-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: fraudshield-network
