services:
  # FastAPI Backend — exposed publicly on Render
  # Streamlit frontend is deployed separately on Streamlit Cloud
  - type: web
    name: fraudshield-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: BACKEND_URL
        value: https://fraudshield-ai-h22k.onrender.com